; Shared hosting (see PRODUCTION-ACCESS.md) commonly ships default PHP upload limits — often
; 2M/8M — well below a real phone/camera photo. That is well UNDER Filament's own declared caps
; (cover_path: 8MB, rich-editor attachments: 8MB), so a legitimate photo the app says it accepts
; gets silently rejected at the raw HTTP layer before Laravel ever sees it, surfacing as
; Livewire's generic "The data.cover_path.<uuid> failed to upload." rather than a real validation
; message. This file is picked up automatically per-directory by PHP-FPM/CGI SAPIs (the normal
; setup on shared hosting) with no server restart needed; on a SAPI that does not honour it
; (mod_php), it is silently ignored rather than breaking anything.
upload_max_filesize = 16M
post_max_size = 20M
max_execution_time = 120
